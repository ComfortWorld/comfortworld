<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfortWorld — Зимний сервер Minecraft</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card: #111726;
            --card2: #161e31;
            --red: #ef4444;
            --grad: linear-gradient(90deg, #ef4444, #f97316);
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }
        #snow { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
        .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 2; }

        header { background: rgba(9, 13, 22, 0.94); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; gap: 15px; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 900; font-size: 20px; }
        .logo span { color: var(--red); }
        .menu { display: flex; gap: 8px; flex-wrap: wrap; }
        .menu a { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 10px; }
        .menu a:hover, .menu a.act { background: rgba(239, 68, 68, 0.15); color: #fff; }
        .right { display: flex; align-items: center; gap: 12px; }
        .ip-pill { background: var(--card2); border: 1px solid var(--border); padding: 7px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
        .curr { display: flex; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .c-btn { background: transparent; border: none; color: var(--muted); padding: 8px 11px; font-size: 12px; font-weight: 800; cursor: pointer; }
        .c-btn.active { background: var(--red); color: #fff; }

        .hero { padding: 60px 0 40px; background: radial-gradient(circle at 75% 40%, rgba(56, 189, 248, 0.16), transparent 50%), radial-gradient(circle at 20% 50%, rgba(239, 68, 68, 0.18), transparent 55%); }
        .hero-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; align-items: center; gap: 30px; }
        .tag { display: inline-block; background: rgba(239, 68, 68, 0.18); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 800; margin-bottom: 16px; }
        .hero h1 { font-size: 46px; font-weight: 900; line-height: 1.08; margin-bottom: 16px; text-transform: uppercase; }
        .hero h1 span { color: var(--red); }
        .hero p { color: #cbd5e1; font-size: 15px; line-height: 1.6; max-width: 500px; margin-bottom: 26px; }
        .btns { display: flex; gap: 14px; flex-wrap: wrap; }
        .btn-red { background: var(--grad); color: #fff; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; }
        .btn-dark { background: var(--card); color: #fff; border: 1px solid var(--border); padding: 14px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; text-decoration: none; }
        .emblem { text-align: center; background: rgba(17, 23, 38, 0.75); border: 1px solid var(--border); border-radius: 22px; padding: 35px 20px; }
        .emblem h2 { font-size: 30px; font-weight: 900; }
        .emblem h2 span { color: var(--red); }
        .emblem-ip { margin-top: 12px; display: inline-block; background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 40px; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; gap: 14px; }
        .stat-ico { font-size: 24px; }
        .stat-val { font-size: 18px; font-weight: 900; }
        .stat-txt { font-size: 12px; color: var(--muted); }

        .shop { padding: 45px 0 60px; }
        .layout { display: grid; grid-template-columns: 240px 1fr; gap: 26px; align-items: start; }
        .side-box { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 18px; }
        .side-title { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 1px; margin-bottom: 12px; text-transform: uppercase; }
        .cat-btn { width: 100%; text-align: left; background: transparent; border: none; color: var(--muted); padding: 12px 14px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; display: block; margin-bottom: 6px; }
        .cat-btn.active, .cat-btn:hover { background: rgba(239, 68, 68, 0.15); color: #fff; border-left: 3px solid var(--red); }
        .dc-btn { display: block; text-align: center; background: #5865F2; color: #fff; text-decoration: none; padding: 11px; border-radius: 10px; font-weight: 800; font-size: 13px; margin-top: 12px; }

        .shop-head { margin-bottom: 20px; }
        .shop-head h2 { font-size: 24px; font-weight: 900; }
        .shop-head p { font-size: 13px; color: var(--muted); }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
        .item { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; text-align: center; position: relative; display: flex; flex-direction: column; }
        .item:hover { border-color: var(--red); transform: translateY(-4px); transition: 0.2s; }
        .b-top { position: absolute; top: 12px; left: 12px; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; background: var(--red); color: #fff; }
        .b-sale { background: #22c55e; color: #052e16; }
        .art { font-size: 48px; margin: 18px 0 12px; }
        .item h3 { font-size: 16px; font-weight: 900; margin-bottom: 6px; }
        .desc { font-size: 12px; color: var(--muted); margin-bottom: 14px; flex-grow: 1; line-height: 1.4; }
        .price { font-size: 20px; font-weight: 900; margin-bottom: 14px; }
        .price span { font-size: 12px; color: var(--muted); font-weight: 600; }
        .buy { width: 100%; background: var(--grad); color: #fff; border: none; padding: 11px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; }

        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
        .info-box { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; }
        .info-box h3 { font-size: 17px; margin-bottom: 8px; }
        .info-box p { font-size: 13px; color: var(--muted); line-height: 1.6; }

        footer { border-top: 1px solid var(--border); padding: 28px 0; color: var(--muted); font-size: 12px; }
        .foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, 0.8); align-items: center; justify-content: center; padding: 20px; }
        .m-box { background: var(--card2); border: 1px solid var(--red); border-radius: 20px; padding: 28px; max-width: 400px; width: 100%; text-align: center; position: relative; }
        .m-close { position: absolute; top: 14px; right: 18px; font-size: 24px; color: var(--muted); cursor: pointer; }
        .m-box h3 { margin-bottom: 12px; }
        .m-box p { color: #cbd5e1; font-size: 14px; line-height: 1.6; margin-bottom: 18px; }

        @media (max-width: 850px) {
            .hero-grid, .layout, .stats { grid-template-columns: 1fr; }
            .hero h1 { font-size: 34px; }
        }
    </style>
</head>
<body>
    <canvas id="snow"></canvas>

    <header>
        <div class="wrap nav">
            <a href="#" class="logo">❄️ Comfort<span>World</span></a>
            <nav class="menu">
                <a href="#" class="act">🏠 Главная</a>
                <a href="#shop">🛒 Магазин</a>
                <a href="#about">ℹ️ О проекте</a>
                <a href="#rules">🛡️ Правила</a>
            </nav>
            <div class="right">
                <div class="ip-pill"><span class="dot"></span> comfortworld.gigacube.host</div>
                <div class="curr">
                    <button class="c-btn active" onclick="setC('UAH', this)">₴ UAH</button>
                    <button class="c-btn" onclick="setC('USD', this)">$ USD</button>
                    <button class="c-btn" onclick="setC('RUB', this)">₽ RUB</button>
                </div>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="wrap">
            <div class="hero-grid">
                <div>
                    <div class="tag">❄️ ДОБРО ПОЖАЛОВАТЬ НА СЕРВЕР</div>
                    <h1>ТВОЙ МИР.<br><span>ТВОИ ПРАВИЛА.</span></h1>
                    <p>Открой для себя уютный зимний Minecraft. Получай привилегии, развивайся, играй с друзьями и создавай свою историю на ComfortWorld!</p>
                    <div class="btns">
                        <button class="btn-red" id="ip-btn" onclick="copyIP()">📋 Скопировать IP</button>
                        <a href="#shop" class="btn-dark">Открыть магазин →</a>
                    </div>
                </div>
                <div class="emblem">
