<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>comfortWorld — Уютный зимний сервер Minecraft</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b1320;
            --bg-card: rgba(23, 37, 62, 0.75);
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #172a46 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Снежинки */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .logo span {
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent);
        }

        /* Переключатель валют */
        .currency-switcher {
            display: flex;
            background: rgba(11, 19, 32, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .currency-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 14px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .currency-btn.active {
            background: var(--accent);
            color: #0b1320;
        }

        /* Главный экран */
        .hero {
            text-align: center;
            padding: 90px 20px 70px;
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 18px;
            max-width: 650px;
            margin: 0 auto 35px;
            line-height: 1.6;
        }

        /* Блок IP */
        .ip-box {
            display: inline-flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 8px 8px 8px 22px;
            border-radius: 14px;
            gap: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            flex-wrap: wrap;
            justify-content: center;
        }

        .ip-text {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .copy-btn {
            background: var(--accent);
            color: #0b1320;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        /* Секции */
        section {
            padding: 60px 0;
        }

        .section-title {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 45px;
            font-size: 15px;
        }

        /* Сетка карточек */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        /* Карточки доната */
        .donate-card {
            position: relative;
        }

        .donate-card.popular {
            border: 2px solid var(--accent);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
        }

        .popular-tag {
            position: absolute;
            top: -12px;
            right: 20px;
            background: var(--accent);
            color: #0b1320;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .price {
            font-size: 30px;
            font-weight: 800;
            color: var(--accent);
            margin: 15px 0;
        }

        .features-list {
            list-style: none;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .features-list li {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 10px;
            padding-left: 22px;
            position: relative;
        }

        .features-list li::before {
            content: "❄";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-size: 12px;
        }

        .buy-btn {
            width: 100%;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .buy-btn:hover, .donate-card.popular .buy-btn {
            background: var(--accent);
            color: #0b1320;
        }

        /* Модальное окно покупки */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #132038;
            border: 1px solid var(--accent);
            border-radius: 18px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: var(--accent);
        }

        .modal-content p {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Подвал */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 40px;
        }

        @media (max-width: 650px) {
            .hero h1 { font-size: 34px; }
            header { justify-content: center; }
        }
    </style>
</head>
<body>

    <canvas id="snow-canvas"></canvas>

    <div class="container">
        <!-- Шапка -->
        <header>
            <div class="logo">comfort<span>World</span></div>
            <nav>
                <a href="#about">О сервере</a>
                <a href="#donate">Привилегии</a>
            </nav>
            <div class="currency-switcher">
